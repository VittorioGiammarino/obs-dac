[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "quad-dac-benchmark"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.6"]
[project.scripts]
quad-dac = "quad_dac.experiment:main"
quad-dac-report = "quad_dac.reporting:main"
[tool.setuptools.packages.find]
include = ["quad_dac*"]
